[package]
name = "launcher"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generic launcher, installer and updater for desktop clients published in the signed release format."

[dependencies]
base64 = "0.23.1"
lexopt = "0.3.2"
p256 = { version = "0.14.0", default-features = false, features = ["std", "ecdsa", "pkcs8"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }
windows = { version = "0.62.2", features = [
   "Win32_Foundation",
   "Win32_Security",
   "Win32_Storage_FileSystem",
   "Win32_System_Com",
   "Win32_System_Com_StructuredStorage",
   "Win32_System_Console",
   "Win32_System_Threading",
   "Win32_System_Variant",
   "Win32_UI_Shell",
   "Win32_UI_Shell_PropertiesSystem",
] }
winsafe = { version = "0.0.29", features = ["gui", "kernel", "user", "advapi", "shell", "ole", "comctl"] }

# Release builds are tuned for size: the exe ships inside every client release.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.11"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
