name: CI

# Pushes run only when something that affects the build or tests changes; doc-only pushes are skipped.
# The path filter does not apply to workflow_dispatch or workflow_call (publish-nuget.yml always runs CI).
on:
  push:
    branches: [main, ci-sandbox]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.editorconfig'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/backend/Em.Api.slnx

      - name: Build
        run: dotnet build src/backend/Em.Api.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/backend/Em.Api.slnx --configuration Release --no-build

  build-and-test-wpf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/frontend/Em.Ui.Wpf.slnx

      - name: Build
        run: dotnet build src/frontend/Em.Ui.Wpf.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/frontend/Em.Ui.Wpf.slnx --configuration Release --no-build

  # Android only; the solution has no test project. The MAUI workload is not preinstalled on any runner.
  build-maui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore src/frontend/Em.Ui.Maui.slnx

      - name: Build
        run: dotnet build src/frontend/Em.Ui.Maui.slnx --configuration Release --no-restore

