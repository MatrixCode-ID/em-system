name: CI

on:
  push:
    branches: [main, ci-sandbox]
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/backend/Em.Api.slnx

      - name: Build
        run: dotnet build src/backend/Em.Api.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/backend/Em.Api.slnx --configuration Release --no-build

  build-and-test-wpf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/frontend/Em.Ui.Wpf.slnx

      - name: Build
        run: dotnet build src/frontend/Em.Ui.Wpf.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/frontend/Em.Ui.Wpf.slnx --configuration Release --no-build
